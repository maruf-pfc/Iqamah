name: Iqamah CI — v1.1.4 Beta

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # 1. Web Client (Vue 3 + Vite, offline-first)
  # ─────────────────────────────────────────────
  client-validate:
    name: Validate Web Client (Vue 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Type Check
      run: bun run type-check

    - name: Lint (ESLint + Oxlint)
      run: bun run lint

    - name: Run Unit Tests (Vitest)
      run: bun run test:unit -- --run

    - name: Production Build
      run: bun run build-only

    - name: Upload current offline web bundle
      uses: actions/upload-artifact@v4
      with:
        name: iqamah-web
        path: client/dist/index.html

  # ─────────────────────────────────────────────
  # 2. Mobile (Flutter — Android APK + release)
  # ─────────────────────────────────────────────
  mobile-validate-and-build:
    name: Validate and Build Mobile (Flutter)
    runs-on: ubuntu-latest
    needs: client-validate
    defaults:
      run:
        working-directory: mobile
    steps:
    - uses: actions/checkout@v4

    - name: Bundle the validated web client
      uses: actions/download-artifact@v4
      with:
        name: iqamah-web
        path: mobile/assets/web

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.35.1'

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze (flutter analyze)
      run: flutter analyze --no-fatal-infos

    - name: Run Unit & Widget Tests
      run: flutter test

    - name: Build verification APK (not distributable)
      run: flutter build apk --debug

    - name: Reject stale bundled web assets
      run: python3 ../scripts/verify-mobile-apk.py build/app/outputs/flutter-apk/app-debug.apk


    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iqamah-debug-verification-${{ github.run_number }}
        path: mobile/build/app/outputs/flutter-apk/*.apk

    # Public release is intentionally manual and blocked on signing/accuracy/upgrade evidence.

  # ─────────────────────────────────────────────
  # 4. Deploy Web Client to Coolify
  #    Only blocks on client + mobile; server is optional
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Coolify
    needs: [client-validate, mobile-validate-and-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Coolify Webhook
      run: |
        if [ -n "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
          echo "Triggering Coolify deploy webhook..."
          curl -i -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}"
        else
          echo "Warning: COOLIFY_WEBHOOK_URL secret is not set, skipping deployment step."
        fi
