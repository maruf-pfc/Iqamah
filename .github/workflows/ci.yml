name: Iqamah CI/CD — v1.1.1

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # 1. Web Client (Vue 3 + Vite, offline-first)
  # ─────────────────────────────────────────────
  client-validate:
    name: Validate Web Client (Vue 3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.2'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Type Check
      run: bun run type-check

    - name: Lint (ESLint + Oxlint)
      run: bun run lint

    - name: Run Unit Tests (Vitest)
      run: bun run test:unit -- --run

    - name: Production Build
      run: bun run build-only

    - name: Upload current offline web bundle
      uses: actions/upload-artifact@v4
      with:
        name: iqamah-web
        path: client/dist/index.html

  # ─────────────────────────────────────────────
  # 2. Server (.NET 10) — optional / legacy
  # ─────────────────────────────────────────────
  server-validate:
    name: Validate Backend (.NET 10) — Optional
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

  # ─────────────────────────────────────────────
  # 3. Mobile (Flutter — Android APK + release)
  # ─────────────────────────────────────────────
  mobile-validate-and-build:
    name: Validate and Build Mobile (Flutter)
    runs-on: ubuntu-latest
    needs: client-validate
    defaults:
      run:
        working-directory: mobile
    steps:
    - uses: actions/checkout@v4

    - name: Bundle the validated web client
      uses: actions/download-artifact@v4
      with:
        name: iqamah-web
        path: mobile/assets/web

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.35.1'

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze (flutter analyze)
      run: flutter analyze --no-fatal-infos

    - name: Run Unit & Widget Tests
      run: flutter test

    - name: Build Universal APK
      run: flutter build apk

    - name: Build Split APKs (per ABI)
      run: flutter build apk --split-per-abi

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iqamah-apks-${{ github.run_number }}
        path: mobile/build/app/outputs/flutter-apk/*.apk

    - name: Create Git Tag for Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
        TAG="v${VERSION}+${{ github.run_number }}"
        echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
        echo "RELEASE_VERSION=v${VERSION}" >> $GITHUB_ENV
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$TAG"
        git push origin "$TAG"

    - name: Create GitHub Release with APKs
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: "Iqamah ${{ env.RELEASE_VERSION }}"
        body: |
          🕌 **Iqamah ${{ env.RELEASE_VERSION }}** — Offline-First Salah Habit Platform

          Built from `main` · commit `${{ github.sha }}`

          ---

          ### 🆕 What's New in v1.1.1

          #### 📱 Mobile UI — Parity with Web Client
          - **Prayer card emoji icons:** Fajr 🌙 Dhuhr ☀️ Asr 🌤️ Maghrib 🌅 Isha 🌃
          - **Left status indicator strip:** Green (offered) / Red (missed) / Teal (excused) / Grey (unlogged)
          - **Circular checkbox trailing indicator:** Animated ✓ / ✕ / empty ring on each card
          - **Visible edit button:** Pencil icon always visible, replacing hidden long-press-only gesture
          - **Responsive 6-column calendar grid:** Full-width date strip (today + 5 past days), matches web layout
          - **Reset Application in Settings:** Wipes database + SharedPreferences, returns to Onboarding

          #### 🐛 Fixes
          - Bengali analytics nav label was showing English `'progress'` — corrected to `'অগ্রগতি'`
          - Calendar date strip was incorrectly generating future dates — now shows only past 5 days + today
          - Dashboard greeting now shows 👋 wave emoji on both platforms

          ---

          ### 📦 Downloads
          - **`app-release.apk`** — Universal APK (all devices)
          - **`app-arm64-v8a-release.apk`** — ARM64 (most modern phones)
          - **`app-armeabi-v7a-release.apk`** — ARM32 (older devices)
          - **`app-x86_64-release.apk`** — x86_64 (emulators)

          ### ✨ Core Features
          - 100% offline — no account, no internet required
          - Local SQLite storage (mobile) + localStorage (web)
          - Offline Salah times via `adhan` library (Karachi method)
          - Hayd / Nifas logging (female users only)
          - Qaza debt tracking and fulfillment
          - JSON backup export / import
          - Bengali + English bilingual UI
          - Onboarding — no login or registration needed
        # Current Android configuration uses debug signing; require manual release review.
        draft: true
        prerelease: false
        files: mobile/build/app/outputs/flutter-apk/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 4. Deploy Web Client to Coolify
  #    Only blocks on client + mobile; server is optional
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Coolify
    needs: [client-validate, mobile-validate-and-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Coolify Webhook
      run: |
        if [ -n "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
          echo "Triggering Coolify deploy webhook..."
          curl -i -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}"
        else
          echo "Warning: COOLIFY_WEBHOOK_URL secret is not set, skipping deployment step."
        fi
