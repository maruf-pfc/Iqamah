sing a prayer due to worldly preoccupation (Shughl), laziness (Kasl), or distraction (Ghaflah) is a major sin. In addition to sincere repentance (Tawbah), the prayer must still be made up as Qaza.`,excused_impurity_title:`Excused Absence — Hayd / Nifas`,excused_impurity_desc:`During menstruation (Hayd) or post-natal bleeding (Nifas), women are legally exempt from praying. No sin is incurred, and no Qaza is required. Note: Janabah (major ritual impurity from marital relations, discharge, etc.) does NOT exempt from prayer — prayer remains obligatory and creates a Qaza debt if missed. The platform automatically excludes Hayd/Nifas days from obligated ratios.`,punctuality_title:`Waqt & Punctuality Windows`,punctuality_sub:`The classification of prayer timings.`,punctuality_desc:`Praying at the beginning of its time is highly beloved in Islam. The platform lets you log your punctuality based on the three classical segments of a prayer's Waqt:`,awwal_waqt_title:`Awwal al-Waqt (First Part)`,awwal_waqt_desc:`Offered within the first 15 to 20 minutes following the Adhan. This reflects maximum zeal, follows the Sunnah closely, and carries the highest spiritual reward.`,wast_waqt_title:`Wast al-Waqt (Middle Part)`,wast_waqt_desc:`Offered during the middle portion of the prayer window. It represents timely compliance before busy periods take over.`,akhir_waqt_title:`Akhir al-Waqt (Late Part)`,akhir_waqt_desc:`Offered near the end of the prayer window, just before the next prayer's time begins. Valid but discouraged to make a habit of delaying.`,using_platform_title:`Using the Iqamah Platform`,using_platform_sub:`How to navigate and log your prayer data.`,using_platform_desc_1:`On the main Dashboard, select a date from the calendar strip, then click Log next to any prayer. Mark whether you offered it, congregation status (Jamaah), travel status (Musafir), or if it was missed, pick a situational Missed Reason.`,using_platform_desc_2:`Any missed prayer (except Hayd / Nifas) creates a pending entry in the Qaza page. Once you make up that prayer, click Fulfill in the ledger to mark it as offered, automatically updating your charts.`,using_platform_desc_3:`The Dial Gauge on the Analytics page calculates your Offered Ratio mathematically: Offered % = Total Offered / (Total Obligated − Hayd/Nifas Days). This ensures jurisprudentially accurate percentages matching your actual religious obligations.`,awwal:`First (Awwal)`,wast:`Middle (Wast)`,akhir:`Late (Akhir)`,impurity:`Hayd / Nifas`,sleep:`Sleep`,forgetfulness:`Forgetfulness`,situational:`Busy / Situational`,laziness:`Laziness`,distraction:`Distraction`,fajr:`Fajr`,dhuhr:`Dhuhr`,asr:`Asr`,maghrib:`Maghrib`,isha:`Isha'`},bn:{dashboard:`ড্যাশবোর্ড`,qaza:`কাজা`,analytics:`অ্যানালিটিক্স`,salah_time:`সালাতের সময়`,guide:`নির্দেশিকা`,logout:`লগআউট`,establish_salah:`সালাত কায়েম করুন (إقامة)`,salah_tagline:`সময়ানুবর্তিতা ট্র্যাক করুন, পরিস্থিতিগত অনুপস্থিতি নথিভুক্ত করুন এবং কাজা আদায় করুন।`,select_date:`তারিখ নির্বাচন করুন`,not_logged:`লিপিবদ্ধ করা হয়নি`,log:`লগ করুন`,edit:`সম্পাদনা`,log_salah:`{salah} সালাত লিপিবদ্ধ করুন`,offered:`আদায় করা হয়েছে`,missed:`ছুটে গেছে`,waqt_punctuality:`ওয়াক্তের সময়ানুবর্তিতা`,options:`বিকল্পসমূহ`,congregation:`জামায়াত (জামাতে)`,traveling:`সফররত (মুসাফির)`,friday_prayer:`জুমু'আহর সালাত`,prayed_at_home:`বাসায় পড়েছেন`,reason_missed:`ছুটে যাওয়ার কারণ`,quran_notes:`কোরআন পাঠের নোট`,quran_notes_placeholder:`যেমন, সূরা আল-বাকারাহ ১-১০, পৃষ্ঠা ৫`,track_tasbih:`সালাতের পর তাসবীহ`,period_hayd:`হায়েজ / নিফাস (Hayd / Nifas)`,save:`লগ সংরক্ষণ করুন`,cancel:`বাতিল`,no_qaza_required:`কাজার প্রয়োজন নেই`,qaza_generated:`কাজা তৈরি হয়েছে`,excused_optgroup:`ক্ষমাযোগ্য ওজর (Excused)`,unexcused_optgroup:`ক্ষমা অযোগ্য (Unexcused)`,qaza_ledger:`কাজা খতিয়ান (قضاء)`,qaza_tagline:`ছুটে যাওয়া সালাতের দায় সংশোধন করুন। অপেক্ষমান কাজা সালাত আদায় করুন।`,outstanding_debt:`বকেয়া কাজা সালাতসমূহ`,no_pending:`কোনো কাজা বাকি নেই!`,no_pending_desc:`আলহামদুলিল্লাহ, আপনার সব কাজা সালাত আদায় করা হয রা। এটি সর্বোচ্চ আগ্রহ ও সুন্নাহর যথাযথ অনুসরণ প্রকাশ করে এবং এর আধ্যাত্মিক সওয়াব সবচেয়ে বেশি।`,wast_waqt_title:`ওয়াসাত ওয়াক্ত (মধ্যবর্তী অংশ)`,wast_waqt_desc:`ওয়াক্তের মাঝামাঝি সময়ে সালাত আদায় করা। এটি কর্মব্যস্ততার মাঝে সময়মতো ফরজ আদায়ের প্রতীক।`,akhir_waqt_title:`আখির ওয়াক্ত (শেষ অংশ)`,akhir_waqt_desc:`ওয়াক্ত শেষ হওয়ার ঠিক কিছু সময় আগে (মাকরূহ সময়ের আগে) সালাত আদায় করা। এটি বৈধ হলেও অভ্যাসগতভাবে সালাত দেরিতে পড়া অনুৎসাহিত।`,using_platform_title:`ইকামা প্ল্যাটফর্ম ব্যবহার নির্দেশিকা`,using_platform_sub:`কীভাবে আপনার সালাতের তথ্য লিপিবদ্ধ এবং পরিচালনা করবেন।`,using_platform_desc_1:`মূল ড্যাশবোর্ডে, ক্যালেন্ডার স্ট্রিপ থেকে একটি তারিখ নির্বাচন করুন, তারপরে যেকোনো সালাতের পাশে **লগ** বাটনে ক্লিক করুন। আপনি সালাত আদায় করেছেন কি না, জামাতে পড়েছেন কি না, সফররত কি না তা নির্বাচন করুন। আর ছুটে গিয়ে থাকলে তার কারণটি বেছে নিন।`,using_platform_desc_2:`হায়েজ / নিফাস ছাড়া অন্য যেকোনো কারণে ছুটে যাওয়া সালাত কাজা পেজে অপেক্ষমান হিসেবে জমা হবে। যখনই কাজা আদায় করবেন, খতিয়ানের পাশে **আদায় করুন** বাটনে ক্লিক করুন।`,using_platform_desc_3:`বিশ্লেষণ পেজের ডায়াল গেজটি আপনার সালাত আদায়ের হার গণনা করে: আদায়ের হার = মোট আদায়কৃত / (মোট ওয়াক্ত − হায়েজ/নিফাসের দিনসমূহ)।`,awwal:`প্রথম (আউয়াল)`,wast:`মধ্যবর্তী (ওয়াসাত)`,akhir:`দেরিতে (আখির)`,impurity:`হায়েজ / নিফাস`,gender_setting:`লিঙ্গ নির্ধারণ`,gender_male:`পুরুষ (মুজাক্কার)`,gender_female:`নারী (মুআন্নাস)`,gender_note:`হায়েজ / নিফাস অপশন শুধুমাত্র নারী ব্যবহারকারীদের জন্য দেখানো হয়।`,sleep:`ঘুম (নওম)`,forgetfulness:`ভুলে যাওয়া (নিসইয়ান)`,situational:`ব্যস্ততা / পরিস্থিতিগত`,laziness:`অলসতা (কাসাল)`,distraction:`উদাসীনতা (গাফলাহ)`,fajr:`ফজর`,dhuhr:`যোহর`,asr:`আসর`,maghrib:`মাগরিব`,isha:`এশা`}};return{currentLocale:e,setLocale:t,toggleLocale:n,t:Y(()=>(t,n)=>{let i=r[e.value][t]||r.en[t]||t;if(n)for(let[e,t]of Object.entries(n))i=i.replace(`{${e}}`,String(t));return i})}}),Ql=function(e){return e[e.Fajr=0]=`Fajr`,e[e.Dhuhr=1]=`Dhuhr`,e[e.Asr=2]=`Asr`,e[e.Maghrib=3]=`Maghrib`,e[e.Isha=4]=`Isha`,e}({}),$l=f
